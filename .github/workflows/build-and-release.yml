name: Build and Release APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/build.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-


      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keystore passwords
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-24)
          KEY_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-24)
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Create keystore for signing
        run: |
          keytool -genkeypair -v \
            -keystore secureotp-release-key.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias secureotp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SecureOTP, OU=Dev, O=SecureOTP, L=Unknown, ST=Unknown, C=US"

      - name: Show keystore
        run: ls -l secureotp-release-key.jks || true

      - name: Build APKs
        run: ./gradlew clean assembleRelease assembleDebug --no-daemon

      - name: Show built APKs
        run: find app/build/outputs/apk -type f -name "*.apk" -maxdepth 5 -print || true

      - name: Determine release tag
        run: |
          if [[ "${GITHUB_REF}" =~ refs/tags/ ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: ${{ env.RELEASE_TAG }}
          body: "Automated build: APKs attached."
          draft: false
          prerelease: false

      - name: Upload APK assets to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          if [ -z "$UPLOAD_URL" ]; then
            echo "No upload URL, skipping asset upload"
            exit 1
          fi
          shopt -s globstar || true
          for apk in app/build/outputs/apk/**/*.apk; do
            if [ -f "$apk" ]; then
              name=$(basename "$apk")
              echo "Uploading $apk as $name"
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/vnd.android.package-archive" \
                --data-binary @"$apk" "$UPLOAD_URL?name=$name"
            fi
          done
