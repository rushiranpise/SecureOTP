name: Build and Release APK

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/build.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-


      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate temporary keystore (no secrets required)
        run: |
          set -e
          echo "Generating temporary keystore on runner"
          KEYSTORE_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-24)
          KEY_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-24)
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          keytool -genkeypair -v \
            -keystore secureotp-release-key.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias secureotp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SecureOTP, OU=Dev, O=SecureOTP, L=Unknown, ST=Unknown, C=US"

      - name: Install Android SDK command-line tools
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          SDK_ROOT=${ANDROID_SDK_ROOT}
          mkdir -p "$SDK_ROOT"
          cd "$SDK_ROOT"
          curl -sSLo cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APKs
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Align and sign APKs
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -e
          SDK_ROOT=${ANDROID_SDK_ROOT}
          BUILD_APKS=(app/build/outputs/apk/release/*.apk app/build/outputs/apk/*/release/*.apk)
          mkdir -p artifacts
          for ap in ${BUILD_APKS[@]}; do
            for f in $ap; do
              if [ -f "$f" ]; then
                base=$(basename "$f" .apk)
                aligned=artifacts/${base}-aligned.apk
                signed=artifacts/${base}-signed.apk
                echo "Aligning $f -> $aligned"
                "$SDK_ROOT/build-tools/34.0.0/zipalign" -v -p 4 "$f" "$aligned"
                echo "Signing $aligned -> $signed"
                "$SDK_ROOT/build-tools/34.0.0/apksigner" sign --ks secureotp-release-key.jks --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD --out "$signed" "$aligned"
              fi
            done
          done


      - name: Show built APKs
        run: find app/build/outputs/apk -type f -name "*.apk" -maxdepth 5 -print || true

      - name: Determine release tag
        run: |
          if [[ "${GITHUB_REF}" =~ refs/tags/ ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: ${{ env.RELEASE_TAG }}
          body: "Automated build: APKs attached."
          draft: false
          prerelease: false

      - name: Upload APK assets to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          if [ -z "$UPLOAD_URL" ]; then
            echo "No upload URL, skipping asset upload"
            exit 1
          fi
          shopt -s nullglob || true
          # Upload signed APKs from artifacts/
          for apk in artifacts/*.apk; do
            if [ -f "$apk" ]; then
              name=$(basename "$apk")
              echo "Uploading $apk as $name"
              curl -s -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/vnd.android.package-archive" \
                --data-binary @"$apk" "$UPLOAD_URL?name=$name"
            fi
          done
          # Note: keystore is not uploaded; use repository secrets to persist keys across runs.
